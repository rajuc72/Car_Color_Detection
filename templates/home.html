<body>
    <h1>🚗 Car Color Detector</h1>
    <div class="upload-box">
        <form id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="file" accept="image/*" required><br>
            <button type="submit">Detect Color</button>
        </form>
        <div>
            <h3>Uploaded Image:</h3>
            <img id="uploadedImage" src="" alt="Uploaded image will appear here" style="max-width:300px; max-height:300px; margin-top:10px; border:1px solid #ccc;"/>
        </div>
        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const resultDiv = document.getElementById('result');
        const uploadedImage = document.getElementById('uploadedImage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            // Display uploaded image preview
            const fileInput = form.querySelector('input[type="file"]');
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImage.src = e.target.result;
                };
                reader.readAsDataURL(fileInput.files[0]);
            }

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    resultDiv.innerHTML = `<span style="color:red;"><strong>Error:</strong> ${err.detail || 'Prediction failed.'}</span>`;
                    return;
                }
                const data = await response.json();
                resultDiv.innerHTML = `<strong>Predicted Color:</strong> ${data.color}`;
            } catch (error) {
                resultDiv.innerHTML = `<span style="color:red;"><strong>Error:</strong> ${error.message}</span>`;
            }
        });
    </script>
</body>
